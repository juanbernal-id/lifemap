services:
  mongo:
    image: mongo:7
    container_name: lifemap_mongo
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/27017"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: ./api
    container_name: lifemap_api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    ports:
      - "5051:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=lifemap
      - GIT_COMMIT=${GIT_COMMIT:-dev}
    volumes:
      - ./outputs:/app/outputs:ro
    depends_on:
      - mongo

  spark-master:
    build: ./spark
    image: lifemap-spark
    container_name: lifemap_spark_master
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('spark-master', 7077), 3)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    command: spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8091:8080"
    volumes:
      - .:/app
      - ivy-cache:/root/.ivy2

  spark-worker:
    build: ./spark
    image: lifemap-spark
    container_name: lifemap_spark_worker
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8081), 3)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    command: spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2g --webui-port 8081
    ports:
      - "8092:8081"
    depends_on:
      - spark-master
    volumes:
      - .:/app
      - ivy-cache:/root/.ivy2

  dask-scheduler:
    build: ./dask
    image: lifemap-dask
    container_name: lifemap_dask_scheduler
    working_dir: /app
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8786), 3)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    command: dask scheduler --port 8786 --dashboard-address :8787
    ports:
      - "8797:8787"

  dask-worker-1:
    build: ./dask
    image: lifemap-dask
    container_name: lifemap_dask_worker_1
    working_dir: /app
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('dask-scheduler', 8786), 3)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    command: dask worker tcp://dask-scheduler:8786 --nworkers 1 --nthreads 2 --memory-limit 2GB
    depends_on:
      - dask-scheduler

  dask-worker-2:
    build: ./dask
    image: lifemap-dask
    container_name: lifemap_dask_worker_2
    working_dir: /app
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('dask-scheduler', 8786), 3)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    command: dask worker tcp://dask-scheduler:8786 --nworkers 1 --nthreads 2 --memory-limit 2GB
    depends_on:
      - dask-scheduler

  kafka:
    image: apache/kafka:3.8.0
    container_name: lifemap_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MINlKI0cRWmCg6SoaG9new
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: lifemap_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic reviews --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic reviews
    restart: "no"

  productor:
    build: ./streaming
    container_name: lifemap_productor
    profiles: ["streaming"]
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=lifemap
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=reviews
      - FECHA_CORTE_T=${FECHA_CORTE_T:-2021-01-01T00:00:00+00:00}
      - SEGUNDOS_POR_MES=${SEGUNDOS_POR_MES:-10}
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  mongo_data:
  ivy-cache:

networks:
  default:
    name: lifemap_network
