services:
  jenkins:
    build: .
    container_name: lifemap_jenkins
    ports:
      - "8090:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "0"

volumes:
  jenkins_home:

networks:
  default:
    name: lifemap_network
    external: true
