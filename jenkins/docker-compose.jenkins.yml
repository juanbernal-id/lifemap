services:
  jenkins:
    build: .
    container_name: lifemap_jenkins
    ports:
      - "8090:8080"
    volumes:
      - lifemap_jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /Users/juan-bernal/Desktop/workspace/lifemap:/Users/juan-bernal/Desktop/workspace/lifemap
    group_add:
      - "0"

volumes:
  lifemap_jenkins_home:

networks:
  default:
    name: lifemap_network
    external: true
